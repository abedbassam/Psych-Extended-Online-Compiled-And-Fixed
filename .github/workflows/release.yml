name: Build + Release (Fixed)
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true # IMPORTANT: Psych Online uses submodules for its C++ libs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install All Dependencies (Forced)
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.0.1
          haxelib install openfl 9.2.1
          haxelib install flixel 5.2.2
          haxelib install flixel-addons 3.0.2
          haxelib install flixel-ui
          haxelib install flixel-tools
          haxelib install hxvlc
          haxelib install tjson
          haxelib git linc_luajit https://github.com/jigsaw-4277821/linc_luajit
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec
          haxelib git extension-androidtools https://github.com/jigsaw-4277821/extension-androidtools
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib run lime setup android
          haxelib run lime setup
        
      - name: Compile Android
        # We use -debug first to see if it catches the error faster, 
        # but change to -final once you know it works.
        run: haxelib run lime build android -final

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "latest-build"
          name: "Psych Online Extended - Android"
          files: export/release/android/bin/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
