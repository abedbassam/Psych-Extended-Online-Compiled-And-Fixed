name: Android Build + Release
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.0.1 --quiet
          haxelib install openfl 9.2.1 --quiet
          haxelib install flixel 5.2.2 --quiet
          haxelib install flixel-addons 3.0.2 --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-tools --quiet
          haxelib install hxvlc --quiet
          haxelib install tjson --quiet
          
          # METHOD: Download ZIPs directly to avoid Git authentication/protocol errors
          # linc_luajit
          curl -L https://github.com/jigsaw-4277821/linc_luajit/archive/refs/heads/main.zip -o luajit.zip
          haxelib install luajit.zip --quiet
          
          # hxCodec
          curl -L https://github.com/polybiusproxy/hxCodec/archive/refs/heads/master.zip -o hxCodec.zip
          haxelib install hxCodec.zip --quiet
          
          # extension-androidtools
          curl -L https://github.com/jigsaw-4277821/extension-androidtools/archive/refs/heads/main.zip -o androidtools.zip
          haxelib install androidtools.zip --quiet
          
          # discord_rpc
          haxelib install discord_rpc --quiet
          
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK $ANDROID_NDK_LATEST_HOME
          haxelib run lime setup
        shell: bash

      - name: Compile APK
        run: haxelib run lime build android -final
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: "android-astra-${{ github.run_number }}"
          name: "Psych Online Android Build #${{ github.run_number }}"
          files: export/release/android/bin/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
