name: Android Build + Release
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Dependencies
        run: |
          echo "Starting Haxelib Setup..."
          haxelib setup ~/haxelib
          
          echo "Installing Base Libraries..."
          haxelib install lime 8.0.1
          haxelib install openfl 9.2.1
          haxelib install flixel 5.2.2
          haxelib install flixel-addons 3.0.2
          haxelib install flixel-ui
          haxelib install flixel-tools
          haxelib install hxvlc
          haxelib install tjson
          haxelib install discord_rpc
          
          echo "Bypassing Git Auth for jigsaw-4277821 repositories..."
          git config --global url."https://${{ github.token }}@github.com/".insteadOf "https://github.com/"
          
          echo "Cloning specific dependencies..."
          mkdir -p ~/deps
          
          git clone --depth 1 https://github.com/jigsaw-4277821/linc_luajit ~/deps/linc_luajit
          haxelib dev linc_luajit ~/deps/linc_luajit
          
          git clone --depth 1 https://github.com/polybiusproxy/hxCodec ~/deps/hxCodec
          haxelib dev hxCodec ~/deps/hxCodec
          
          git clone --depth 1 https://github.com/jigsaw-4277821/extension-androidtools ~/deps/extension-androidtools
          haxelib dev extension-androidtools ~/deps/extension-androidtools

          echo "Finalizing Android SDK/NDK Linkage..."
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK $ANDROID_NDK_LATEST_HOME
          haxelib run lime setup
          echo "All dependencies installed successfully!"
        shell: bash

      - name: Compile APK
        run: |
          echo "Starting the main C++ Build for Android..."
          echo "Using -final flag for RedMagic performance optimization."
          haxelib run lime build android -final
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: "astra-android-v${{ github.run_number }}"
          name: "Psych Online Android - Build ${{ github.run_number }}"
          files: export/release/android/bin/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
